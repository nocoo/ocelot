name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: deploy
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@9933a7461a312cfaac526ccc5907357a7e3f669a # v2026.25
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: "project"
      artifact-name: b1-dist
      artifact-path: dist
      deploy-script: bun run deploy
      verify-command: bun scripts/verify-deployment.ts "$SOURCE_SHA"
      environment: production
      concurrency-group: ocelot-production
      timeout-minutes: 15
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
