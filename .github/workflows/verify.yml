name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      node-version: "26.8.1"
      install-policy: "project"
      gitleaks-config: ".gitleaks.toml"
      coverage-path: "coverage"
      prepare-command: |
        bun run types
        git diff --exit-code -- worker/worker-configuration.d.ts
      test-command: "bun run test:coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      build: true
      build-command: |
        bun run build
        bun run worker:check

  browser:
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      node-version: "26.8.1"
      install-policy: "project"
      pre-command: |
        bun run types
        git diff --exit-code -- worker/worker-configuration.d.ts
        bun x playwright install --with-deps webkit
      browser: chromium
      command: bun run test:e2e
      artifact-name: browser-verification
      artifact-path: |
        playwright-report/
        test-results/
