# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L3, Z1 via quality.yml;
# na L1.5, P1; todo L2. nocoo/base-ci v2026.12: top-level slot jobs, L3 browsers/artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: "project"
      gitleaks-config: ".gitleaks.toml"
      coverage-path: "coverage"
      prepare-command: |
        bun run types
        git diff --exit-code -- worker/worker-configuration.d.ts
      test-command: |
        bun run test:coverage
        bun run test:l1-gate
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      build: true
      build-command: |
        bun run build
        bun run worker:check
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      l3: true
      l3-browsers: "chromium webkit"
      l3-prepare-command: |
        bun run types
        git diff --exit-code -- worker/worker-configuration.d.ts
      l3-command: bun run test:e2e
      l3-artifact-name: browser-verification
      l3-artifact-path: |
        playwright-report/
        test-results/
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "Worker 运行时用例在 L1 的 vitest worker 工程内随 test:coverage 执行，未单独启用 worker 作业"},
        "L2": {"status": "todo", "reason": "尚无覆盖全部 API 端点/方法的独立 HTTP E2E 套件（手册 L2 维度仍为 planned）"},
        "L3": {"status": "impl"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
