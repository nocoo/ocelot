name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify generated bindings
        run: |
          bun run types
          git diff --exit-code -- worker/worker-configuration.d.ts
      - name: Types, lint, coverage and production build
        run: bun run check
      - name: Package production Worker
        run: bun run worker:check
      - name: Install test browser
        run: bun x playwright install --with-deps chromium
      - name: Browser flows on local Wrangler
        run: bun run test:e2e
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification
          path: |
            coverage/
            playwright-report/
            test-results/
          retention-days: 7
